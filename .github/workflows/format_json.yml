name: format-json

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Format time-of-day quote buckets
        run: python3 scripts/format_time_of_day_quotes.py

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "JSON is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add time_of_day_quotes_with_bold.json
          git commit -m "chore: format time-of-day quotes"
          git push
